[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chladni-api"
version = "0.1.0"
description = "Rayleigh-Ritz Chladni plate eigenmode API. Free-edge and clamped boundary conditions, rendered as SVG or PNG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "EinarAl" }]
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "scipy>=1.11",
    "pydantic>=2,<3",
    "Pillow>=10",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["chladni", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
